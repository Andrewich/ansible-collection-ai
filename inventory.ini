# The LLM runs on the controller, so every host is executed locally and only the
# BMC is contacted over the network. No package, runtime or model is deployed to
# the managed servers.
[bmc]
localhost ansible_connection=local

[bmc:vars]
# Interpreter that has llama-cpp-python installed (see README, "Установка").
ansible_python_interpreter=/home/dsh/ansible/.venv/bin/python
llm_model=/home/dsh/ansible/.models/LFM2-350M-Extract-Q4_K_M.gguf
